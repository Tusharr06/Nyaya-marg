name: nyaya_marg
description: "A legal assistant app with AI-powered tools."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  # UI & Fonts
  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.2

  # Firebase
  firebase_core: ^4.2.0
  firebase_auth: ^6.1.1
  google_sign_in: ^7.2.0
  cloud_firestore: ^6.0.3

  # File & Network
  file_picker: ^10.3.3
  dio: ^5.9.0
  path_provider: ^2.1.3

  # AI
  google_generative_ai: ^0.4.7  # Latest stable

  # PDF Text Extraction (Syncfusion)
  syncfusion_flutter_pdf: ^31.2.3

  # Optional: PDF Preview (if needed)
  # pdfx: ^2.5.0

  # MARKDOWN — OFFICIAL & RECOMMENDED
  flutter_markdown: ^0.7.7+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0  # UPDATED

flutter:
  uses-material-design: true

  assets:
    - assets/google_logo.png
    - assets/logo.png