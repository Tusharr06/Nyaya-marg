name: nyaya_marg
description: "A legal assistant app with AI-powered tools."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  # UI & Fonts
  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.2
  intl: ^0.19.0

  # Firebase
  firebase_core: ^4.2.0
  firebase_auth: ^6.1.1
  google_sign_in: ^6.2.1
  cloud_firestore: ^6.0.3
  firebase_storage: ^13.0.0
  firebase_analytics: ^12.0.0

  # File & Network
  file_picker: ^10.3.3
  dio: ^5.9.0
  path_provider: ^2.1.3
  http: ^1.3.0

  # AI
  google_generative_ai: ^0.4.7  # Latest stable

  # PDF Text Extraction (Syncfusion)
  syncfusion_flutter_pdf: ^31.2.3

  # Optional: PDF Preview (if needed)
  # pdfx: ^2.5.0

  # MARKDOWN — OFFICIAL & RECOMMENDED
  flutter_markdown: ^0.7.7+1
  cached_network_image: ^3.4.1
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  font_awesome_flutter: ^11.0.0
  fl_chart: ^1.2.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  geolocator: ^14.0.2
  lottie: ^3.3.3
  url_launcher: ^6.3.2
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0  # UPDATED

flutter:
  uses-material-design: true

  assets:
    - assets/google_logo.png
    - assets/logo.png